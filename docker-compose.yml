# Local development services for Shoprex V1.
# Only PostgreSQL runs here; backend/, web/, and mobile/ run on the host.
services:
  postgres:
    image: postgres:16-alpine
    container_name: shoprex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shoprex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shoprex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shoprex}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shoprex_postgres_data:
